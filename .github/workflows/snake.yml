name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at midnight UTC
  workflow_dispatch: {}    # run manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Chimbo1234
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d4af37&color_dots=#0b1410,#065f46,#059669,#10b981,#34d399
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d4af37

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
